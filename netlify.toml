[build]
  # 静的サイト用の設定
  command = "chmod +x build.sh && ./build.sh"
  
  # 公開ディレクトリ（ルートディレクトリを指定）
  publish = "."

[build.environment]
  # Node.jsのバージョン
  NODE_VERSION = "18"
  
  # 静的サイトであることを明示
  STATIC_SITE = "true"

# リダイレクト設定
[[redirects]]
  # SPA（Single Page Application）用の設定
  # すべてのルートをindex.htmlにリダイレクト
  from = "/*"
  to = "/index.html"
  status = 200

# ヘッダー設定
[[headers]]
  # すべてのファイルに対するセキュリティヘッダー
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; font-src 'self'"

# キャッシュ設定
[[headers]]
  # 静的ファイルのキャッシュ設定
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# フォーム処理（将来的に使用する可能性がある場合）
# [[redirects]]
#   from = "/api/*"
#   to = "/.netlify/functions/:splat"
#   status = 200

# エラーページ設定
[[redirects]]
  from = "/404"
  to = "/index.html"
  status = 404
